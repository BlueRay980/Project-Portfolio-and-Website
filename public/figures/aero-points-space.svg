<text x="96" y="612" font-size="14.5" fill="#322f36"><tspan font-weight="700" fill="#9e1b32">Best 192.6 pts at Cl -5.0, Cd -1.0</tspan>, the corner of the swept range, so the sweep bounds the optimum rather than finding it.</text>
<text x="96" y="636" font-size="14.5" fill="#645f6b">Endurance runs 2186 to 2213 s against a 1410 s reference, so it scores 0.0 at all 25 points and adds nothing to these totals.</text>
<text x="96" y="658" font-size="14.5" fill="#645f6b">Read the direction as the result. The absolute points await a re-calibration of the corrected model.</text>
