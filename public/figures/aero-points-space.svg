<text x="540" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#322f36">Aero design space after the physics correction</text>
<text x="540" y="74" text-anchor="middle" font-size="15.5" fill="#645f6b">CR26I at 293.41 kg. Points across acceleration, skidpad and autocross; endurance scores zero everywhere.</text>
<text x="540" y="104" text-anchor="middle" font-size="15.5" font-weight="600" fill="#9e1b32">Cl and Cd are stored negative, so more negative means more downforce and more drag.</text>
<text x="540" y="126" text-anchor="middle" font-size="15.5" font-weight="600" fill="#9e1b32">The best point is the bottom-right corner: most downforce, least drag.</text>
<text x="550" y="158" text-anchor="middle" font-size="16" font-weight="600" fill="#322f36">less drag &#8594;</text>
