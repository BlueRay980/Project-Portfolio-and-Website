<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" font-family="Helvetica, Arial, sans-serif">
<rect width="1120" height="620" fill="#ffffff"/>
<text x="560" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#1a1d21">One-at-a-time sensitivity, CR26I at 293.41 kg</text>
<text x="560" y="70" text-anchor="middle" font-size="16" fill="#5b6470">Michigan Endurance IC 2026, baseline lap 129.23 s. Each parameter swept alone, -50% to +50% in 1% steps.</text>
<text x="560" y="100" text-anchor="middle" font-size="15.5" font-weight="600" fill="#9e1b32">Cl, Cd and centre of pressure are stored negative in the vehicle workbook.</text>
<text x="560" y="121" text-anchor="middle" font-size="15.5" font-weight="600" fill="#9e1b32">So +50% on Cl means Cl -5.52, which is MORE downforce, and it makes the car faster.</text>
