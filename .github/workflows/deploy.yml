name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. A new run supersedes anything already queued or running
# in this group, so a stuck run can never block the next one. The trade is that
# a rapid second push cancels the first deploy rather than queueing behind it,
# which for a static site is the right way round: the newer commit is the one
# worth publishing, and a half-finished deploy is never left live because the
# deploy step is atomic.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build with Astro
        uses: withastro/action@v3
        with:
          # Astro 7 requires Node >= 22.12.0.
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
